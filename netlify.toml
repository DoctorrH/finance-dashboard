[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/finfo/*"
  to = "https://finfo-api.vndirect.com.vn/v4/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/dchart/*"
  to = "https://dchart-api.vndirect.com.vn/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
